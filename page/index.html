<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>超级麦吉设置</title>
<script src="_magpie/bridge.js"></script>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 16px 18px 28px;
    font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg, #1b1b1d); color: var(--fg, #e6e6e6);
  }
  h1 { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
  .sub { opacity: .6; margin: 0 0 16px; font-size: 12px; }
  section { border: 1px solid rgba(128,128,128,.25); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  .now { font-size: 12px; opacity: .8; margin-bottom: 10px; }
  .now b { font-weight: 600; opacity: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  button.chip {
    font: inherit; padding: 5px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(128,128,128,.35); background: transparent; color: inherit;
  }
  button.chip:hover { background: rgba(128,128,128,.16); }
  button.chip[aria-pressed="true"] { border-color: var(--accent, #6b8afd); background: rgba(107,138,253,.18); }
  .custom { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type="text"] {
    font: inherit; padding: 6px 9px; border-radius: 8px; min-width: 190px;
    border: 1px solid rgba(128,128,128,.35); background: rgba(128,128,128,.08); color: inherit;
  }
  button.save {
    font: inherit; padding: 6px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--accent, #6b8afd); background: rgba(107,138,253,.22); color: inherit;
  }
  .hint { font-size: 12px; opacity: .55; margin-top: 8px; }
  #status { position: sticky; bottom: 0; font-size: 12px; padding: 8px 0 0; min-height: 18px; }
  #status.ok { color: #5ec27d; }
  #status.bad { color: #f2777a; }
</style>
</head>
<body>
  <h1>超级麦吉设置</h1>
  <p class="sub">新账号的邀请上级在这里设置。改完立即生效，不需要重新登录。</p>

  <div id="app"></div>
  <div id="status"></div>

  <script src="codes.js"></script>
  <script src="app.js"></script>
</body>
</html>
