name: check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: MYCF711/magpie-plugin-scaffold
          path: scaffold
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 供应商插件规定
        working-directory: plugin
        run: node ../scaffold/scripts/check.mjs .
      - name: 全部离线语义测试
        working-directory: plugin
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            case "$f" in
              tests/smoke.mjs)
                echo "== $f =="
                echo "跳过：本机环境 smoke，依赖真实凭据/模型目录；PR 门禁由离线测试覆盖"
                ;;
              tests/browser-login.mjs)
                echo "== $f =="
                echo "跳过：会真的拉起浏览器；headless runner 上的耗时波动不代表登录语义，改在本机跑"
                ;;
              *)
                echo "== $f =="
                node "$f"
                ;;
            esac
          done
      - name: 打包面预演
        working-directory: plugin
        run: npm pack --dry-run
